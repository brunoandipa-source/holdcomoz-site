<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HoldCo Moz — Em breve | Coming soon</title>
<meta name="description" content="HoldCo Moz — website em construção. Website coming soon.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230E2233'/%3E%3Ctext x='32' y='42' font-family='Georgia,serif' font-size='30' fill='%23D4A84B' text-anchor='middle'%3EH%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0E2233; --bg2:#13314A; --ink:#F4F1EA; --muted:#A9B7C4; --gold:#D4A84B; --line:rgba(212,168,75,.35);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    min-height:100vh; display:flex; flex-direction:column;
    background:radial-gradient(1200px 700px at 80% -10%, #1B4566 0%, transparent 60%),
               radial-gradient(900px 600px at -10% 110%, #123A3A 0%, transparent 55%),
               linear-gradient(160deg,var(--bg) 0%,var(--bg2) 100%);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  main{flex:1; display:flex; align-items:center; justify-content:center; padding:48px 20px}
  .card{max-width:640px; width:100%; text-align:center}
  .mark{
    width:72px; height:72px; margin:0 auto 28px; border-radius:18px;
    border:1px solid var(--line); display:grid; place-items:center;
    font-family:Georgia,"Times New Roman",serif; font-size:34px; color:var(--gold);
    background:rgba(255,255,255,.03);
  }
  .brand{
    font-family:Georgia,"Times New Roman",serif; font-weight:normal;
    font-size:clamp(34px,7vw,56px); letter-spacing:.04em; line-height:1.1;
  }
  .brand span{color:var(--gold)}
  .rule{width:64px; height:1px; background:var(--gold); margin:26px auto; opacity:.8}
  .status{font-size:clamp(17px,3.2vw,21px); line-height:1.5; font-weight:500}
  .status small{display:block; color:var(--muted); font-weight:400; font-size:.88em; margin-top:4px}
  .pill{
    display:inline-flex; align-items:center; gap:10px; margin-top:34px;
    padding:10px 18px; border:1px solid var(--line); border-radius:999px;
    font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted);
  }
  .dot{width:8px; height:8px; border-radius:50%; background:var(--gold); animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){.dot{animation:none}}
  .contact{margin-top:30px; font-size:13px; letter-spacing:.06em; color:var(--muted); line-height:1.9}
  .contact a{color:var(--ink); font-size:16px; letter-spacing:.02em; text-decoration:none; border-bottom:1px solid var(--line); padding-bottom:2px}
  .contact a:hover{color:var(--gold); border-color:var(--gold)}
  @media (max-width:480px){.pill{font-size:11px; letter-spacing:.1em; padding:9px 14px}}
  footer{padding:22px 20px; text-align:center; font-size:12.5px; color:var(--muted); letter-spacing:.03em}
</style>
</head>
<body>
  <main>
    <div class="card">
      <div class="mark" aria-hidden="true">H</div>
      <h1 class="brand">HoldCo <span>Moz</span></h1>
      <div class="rule"></div>
      <p class="status">
        O nosso website estará disponível em breve.
        <small>Our website is coming soon.</small>
      </p>
      <div class="pill"><span class="dot" aria-hidden="true"></span>Em construção · Under construction</div>
      <p class="contact">Contacto · Contact<br><a href="mailto:contact@holdcomoz.com">contact@holdcomoz.com</a></p>
    </div>
  </main>
  <footer>© <span id="y">2026</span> HoldCo Moz · Maputo, Moçambique</footer>
  <script>document.getElementById('y').textContent=new Date().getFullYear();</script>
</body>
</html>
