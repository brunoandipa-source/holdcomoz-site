<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HoldCo Moz — Em breve | Coming soon</title>
<meta name="description" content="HoldCo Moz — Maputo, Moçambique. Website em construção. Website coming soon.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230E2233'/%3E%3Ctext x='32' y='45' font-family='Georgia,serif' font-size='38' fill='%23D4A84B' text-anchor='middle'%3EH%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#0E2233; --ink:#F4F1EA; --muted:#A9B7C4; --gold:#D4A84B; --line:rgba(212,168,75,.35);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    min-height:100vh; display:flex; flex-direction:column;
    background:var(--bg); color:var(--ink);
    font-family:Manrope,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  main{flex:1; display:flex; align-items:center; justify-content:center; padding:56px 20px}
  .card{max-width:680px; width:100%; text-align:center}
  .brand{
    font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif; font-weight:500;
    font-size:clamp(46px,10vw,84px); letter-spacing:.04em; line-height:1;
  }
  .brand span{color:var(--gold)}
  .rule{width:72px; height:2px; background:var(--gold); margin:28px auto 18px}
  .place{font-size:12px; font-weight:600; letter-spacing:.32em; color:var(--muted); text-transform:uppercase}
  .status{margin-top:52px; font-size:clamp(17px,3.2vw,20px); line-height:1.5; font-weight:500}
  .status small{display:block; color:var(--muted); font-weight:400; font-size:.9em; margin-top:4px}
  .pill{
    display:inline-flex; align-items:center; gap:10px; margin-top:30px;
    padding:10px 18px; border:1px solid var(--line); border-radius:999px;
    font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted);
  }
  .dot{width:8px; height:8px; border-radius:50%; background:var(--gold); animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){.dot{animation:none}}
  .contact{margin-top:30px; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); line-height:2.2}
  .contact a{color:var(--ink); font-size:16px; letter-spacing:.02em; text-transform:none; text-decoration:none; border-bottom:1px solid var(--line); padding-bottom:2px}
  .contact a:hover{color:var(--gold); border-color:var(--gold)}
  @media (max-width:480px){.pill{font-size:10.5px; letter-spacing:.1em; padding:9px 14px}.place{letter-spacing:.24em}}
  footer{padding:22px 20px; text-align:center; font-size:12.5px; color:var(--muted); letter-spacing:.03em}
</style>
</head>
<body>
  <main>
    <div class="card">
      <h1 class="brand">HoldCo <span>Moz</span></h1>
      <div class="rule"></div>
      <p class="place">Maputo · Moçambique</p>
      <p class="status">
        O nosso website estará disponível em breve.
        <small>Our website is coming soon.</small>
      </p>
      <div class="pill"><span class="dot" aria-hidden="true"></span>Em construção · Under construction</div>
      <p class="contact">Contacto · Contact<br><a href="mailto:contact@holdcomoz.com">contact@holdcomoz.com</a></p>
    </div>
  </main>
  <footer>© <span id="y">2026</span> HoldCo Moz</footer>
  <script>document.getElementById('y').textContent=new Date().getFullYear();</script>
</body>
</html>
